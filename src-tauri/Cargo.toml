[workspace]
members = ["."]
resolver = "3"

[package]
name = "woodshed"
version = "0.1.0"
description = "Woodshed — bass and guitar practice tools"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
name = "woodshed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2.10.2"
cpal = "0.18.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
thiserror = "2.0.21"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis", "alac"] }
hound = "3.5.1"
signalsmith-stretch = "0.1.3"
rubato = "5.0.1"

# DSP and decoding crates are slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.signalsmith-stretch]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
