[tools]
node = "26.13.0"
pnpm = "12.18.0"
rust = { version = "1.99.1", components = "rustfmt,clippy" }

[env]
CARGO_BUILD_JOBS = "4"

[tasks."check:web"]
description = "biome, tsc, vitest"
run = [
  "pnpm exec biome check .",
  "pnpm exec tsc --noEmit",
  "pnpm exec vitest run --maxWorkers=2",
]

[tasks."check:rust"]
description = "cargo fmt, clippy, test"
dir = "src-tauri"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
]

[tasks.binaries]
description = "Fetch yt-dlp and build ffmpeg (stem splitter sidecars)"
run = "sh scripts/fetch-binaries.sh"

[tasks.app]
description = "Build Woodshed.app (signed with the local signing identity when it exists)"
run = "sh scripts/build-app.sh"

[tasks."app:release"]
description = "Build Woodshed.app signed with Developer ID, notarized and stapled"
run = "sh scripts/build-release.sh"

[tasks.signing-cert]
description = "Create the local code-signing identity that keeps macOS permissions across rebuilds"
run = "sh scripts/create-local-signing-cert.sh"

[tasks.stem-model]
description = "Download htdemucs_6s weights and build the Core ML stem model"
run = "sh tools/stem-model/build.sh"

[tasks.check]
description = "Run every check (web, then rust)"
run = [
  "mise run check:web",
  "mise run check:rust",
]

[tasks.release]
description = "Release X.Y.Z to GitHub: version commit and tag, notarized app and DMG, update files (README)"
run = "sh scripts/release.sh"
